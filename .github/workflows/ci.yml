name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ccl_ci
      TEST_DATABASE_REQUIRED: "1"
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ccl_ci
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d ccl_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install isolated test dependencies
        run: |
          python -m pip install 'markdown-it-py>=3,<5'
          npm ci
      - name: Build core packages and web
        run: npm run build
      # The build step already compiled every workspace package; skip the pretest rebuild.
      - name: Test core with disposable PostgreSQL schemas
        run: npm test --ignore-scripts
      - name: Test public document onboarding with disposable PostgreSQL schemas
        run: npm run test:document-onboarding
      - name: Validate portable core documentation
        run: |
          make docs
          make docs-check
          make test
          git diff --exit-code -- docs/index.html docs/build-manifest.json docs/knowledge/index.html docs/knowledge/build-manifest.json
